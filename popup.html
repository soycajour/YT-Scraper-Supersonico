<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; font-family: sans-serif; background: #000; color: #fff; padding: 15px; margin: 0; border: 2px solid #d00; }
    h3 { margin: 0 0 15px 0; text-align: center; text-transform: uppercase; letter-spacing: 2px; color: #d00; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 10px; text-transform: uppercase; margin-bottom: 5px; color: #aaa; }
    input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 8px; box-sizing: border-box; outline: none; }
    input:focus { border-color: #d00; }
    button { width: 100%; background: #d00; color: #fff; border: none; padding: 14px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
    button:hover { background: #ff0000; box-shadow: 0 0 10px #d00; }
    #status { margin-top: 15px; font-size: 11px; color: #888; text-align: center; font-weight: bold; text-transform: uppercase; }
  </style>
</head>
<body>
  <h3>YT Scraper</h3>
  <div class="input-group">
    <label>Cantidad de links (0 = todos)</label>
    <input type="number" id="limit" placeholder="Ej: 300" min="0">
  </div>
  <button id="btn">Extraer Enlaces</button>
  <div id="status">Listo para la extracción.</div>
  <script src="popup.js"></script>
</body>
</html>
